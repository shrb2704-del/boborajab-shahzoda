<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Свадебные приглашения · варианты</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap">
<style>
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; box-sizing: border-box;
         background: #F3EEE6; color: #2B2522; font-family: "Cormorant Garamond", Georgia, serif; text-align: center; }
  h1 { font-weight: 500; font-size: 34px; margin: 0 0 8px; }
  p { margin: 0 0 28px; font-style: italic; color: #6E6560; font-size: 19px; }
  .list { display: grid; gap: 14px; width: min(360px, 100%); margin: 0 auto; }
  a { display: block; padding: 22px; border-radius: 999px 999px 6px 6px; text-decoration: none; font-size: 24px; color: #FBF6EA; }
  a small { display: block; font-size: 15px; opacity: .8; font-style: italic; }
  .b { background: #6E1423; } .s { background: #4E5C45; }
</style>
</head>
<body>
<main>
  <h1>Варианты приглашений</h1>
  <p>Выберите дизайн, чтобы посмотреть</p>
  <div class="list">
    <a class="b" href="bordo/">Бордо<small>конверт с восковой печатью</small></a>
    <a class="s" href="shalfey/">Шалфей<small>двери-арка и оливковые ветви</small></a>
  </div>
</main>
</body>
</html>
