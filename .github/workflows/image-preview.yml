name: Fetch reference photos for review

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated image URLs
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and downscale
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir out && cd out
          i=0
          for u in $URLS; do
            i=$((i+1))
            curl -fsSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -m 60 -o "src_$i" "$u" || { echo "fail $u"; continue; }
            convert "src_$i[0]" -resize '1400x1400>' -quality 86 "photo_$i.jpg" && convert "photo_$i.jpg" -resize 520x -quality 70 "thumb_$i.jpg"
            identify "photo_$i.jpg"
            echo "$i $u" >> sources.txt
            rm -f "src_$i"
          done
      - name: Publish to image-preview branch
        run: |
          cd out
          git init -q -b image-preview
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Reference photos for review"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" image-preview
