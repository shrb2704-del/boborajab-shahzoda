name: Fetch reference photos for review

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated image URLs
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and downscale
        env:
          URLS: ${{ inputs.urls }}
        run: |
          pip install -q pillow
          mkdir out && cd out
          i=0
          for u in $URLS; do
            i=$((i+1))
            curl -fsSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -m 60 -o "src_$i" "$u" || { echo "fail $u"; continue; }
            python3 -c "
          from PIL import Image
          im = Image.open('src_$i').convert('RGB')
          print('$i', im.size)
          im.thumbnail((1600, 1600)); im.save('photo_$i.jpg', quality=88)
          t = im.copy(); t.thumbnail((520, 520)); t.save('thumb_$i.jpg', quality=72)
          " || continue
            echo "$i $u" >> sources.txt
            rm -f "src_$i"
          done
      - name: Publish to image-preview branch
        run: |
          cd out
          git init -q -b image-preview
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Reference photos for review"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" image-preview
