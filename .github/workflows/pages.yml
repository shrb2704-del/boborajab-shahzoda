name: Publish invitation to GitHub Pages

on:
  push:
    branches: [claude/upbeat-johnson-gv3es5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Artwork, hero video and music live in Higgsfield storage, not in git.
      ASSETS_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/628f55c3-2323-4be2-817b-4f205b5dd50b.gz
      ASSETS_SHA256: 596f4435f4df54a89b9ad93f9c1a428778c7417e75f43cdf00395431de2798a1
      ASSETS2_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/cceb47ff-d636-45f2-9466-dc3694e22328.gz
      ASSETS2_SHA256: 202c9620ab70ef19ac810e2df043998fa6e8ba28f87455207127f1bd031bc594
      # Link-preview postcard (hero still + names), rendered from the same assets.
      OG_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/b82aa55d-d17c-47ce-b522-18e73bb1822e.jpg
      OG_SHA256: b627b5e2c75fbbddcdb56f18ed09f743c185aad01a36e583039c740965980067
      OG_UZ_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/0ef96cf1-1650-4b62-8524-a738789d01c9.jpg
      OG_UZ_SHA256: c110bf85e58643a5ce1e30c75820210d5b50900639ec908bd4260707f01ca790
      OG_RU_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/e72d92ec-1973-4a24-b35f-1ec35ca6d430.jpg
      OG_RU_SHA256: ba102dcc1b81da83c6b30b37822a9713ab6caa8266817a07c109d2aa6817e5d9
      OG_RUG_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/ae8b6f27-8536-4b92-bbac-8180a7c99131.jpg
      OG_RUG_SHA256: f0e5eb52335b32b6d12bd66ab4960dd31835bc15dd4f385033140bee75af2c64
    steps:
      - uses: actions/checkout@v4

      - name: Fetch invitation assets
        run: |
          curl -fsSL -o assets.tar.gz "$ASSETS_URL"
          echo "$ASSETS_SHA256  assets.tar.gz" | sha256sum -c -
          tar xzf assets.tar.gz -C invite
          curl -fsSL -o assets2.tar.gz "$ASSETS2_URL"
          echo "$ASSETS2_SHA256  assets2.tar.gz" | sha256sum -c -
          tar xzf assets2.tar.gz -C invite2
          rm assets.tar.gz assets2.tar.gz
          curl -fsSL -o davatnoma/img/og-card.jpg "$OG_URL"
          echo "$OG_SHA256  davatnoma/img/og-card.jpg" | sha256sum -c -
          curl -fsSL -o azimxoja-oydin/og-card.jpg "$OG_UZ_URL"
          echo "$OG_UZ_SHA256  azimxoja-oydin/og-card.jpg" | sha256sum -c -
          curl -fsSL -o veronika/og-card.jpg "$OG_RU_URL"
          echo "$OG_RU_SHA256  veronika/og-card.jpg" | sha256sum -c -
          curl -fsSL -o ru/og-card.jpg "$OG_RUG_URL"
          echo "$OG_RUG_SHA256  ru/og-card.jpg" | sha256sum -c -

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html invite invite2 davatnoma azimxoja-oydin veronika ru bordo shalfey _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
