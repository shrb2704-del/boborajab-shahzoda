name: Publish invitation to GitHub Pages

on:
  push:
    branches: [claude/upbeat-johnson-gv3es5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Artwork, hero video and music live in Higgsfield storage, not in git.
      ASSETS_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/628f55c3-2323-4be2-817b-4f205b5dd50b.gz
      ASSETS_SHA256: 596f4435f4df54a89b9ad93f9c1a428778c7417e75f43cdf00395431de2798a1
      ASSETS2_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/cceb47ff-d636-45f2-9466-dc3694e22328.gz
      ASSETS2_SHA256: 202c9620ab70ef19ac810e2df043998fa6e8ba28f87455207127f1bd031bc594
      # Link-preview postcard (hero still + names), rendered from the same assets.
      OG_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/b82aa55d-d17c-47ce-b522-18e73bb1822e.jpg
      OG_SHA256: b627b5e2c75fbbddcdb56f18ed09f743c185aad01a36e583039c740965980067
      OG_UZ_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/0ef96cf1-1650-4b62-8524-a738789d01c9.jpg
      OG_UZ_SHA256: c110bf85e58643a5ce1e30c75820210d5b50900639ec908bd4260707f01ca790
      OG_RU_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/e72d92ec-1973-4a24-b35f-1ec35ca6d430.jpg
      OG_RU_SHA256: ba102dcc1b81da83c6b30b37822a9713ab6caa8266817a07c109d2aa6817e5d9
      OG_RUG_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/ae8b6f27-8536-4b92-bbac-8180a7c99131.jpg
      OG_RUG_SHA256: f0e5eb52335b32b6d12bd66ab4960dd31835bc15dd4f385033140bee75af2c64
      # Чойгаштак: веточка, чайник (сгенерированы в Higgsfield) и открытка для превью
      CHOY_SPRIG_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/9909c07d-56ff-4b64-9796-c4fb9f356b92.webp
      CHOY_SPRIG_SHA256: 327c69560cf4ae24decf96ca6f5da79675d6b3b379095f3301e0530433f4f73a
      CHOY_TEA_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/dfb38431-c3c3-4315-b8d1-6124268b989e.webp
      CHOY_TEA_SHA256: 050bdc372117a42c9e607c19588c1e971148b39f34e25ad405f9987d1617667b
      OG_CHOY_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/7efcfbe7-7576-435c-8db0-55abe51ca259.jpg
      OG_CHOY_SHA256: 3c1277286be8cd16d1ab4cdb804482dc59242efcb1ef87518a7f28b86840abf3
      # временные фото для галереи Чойгаштака (g1–g6.webp), заменить на фото пары
      CHOY_GALLERY_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/ddd26b90-e2e8-45ed-b42d-c0f234613694.gz
      CHOY_GALLERY_SHA256: b63cedb9bc7989c6f20f65172218a3e464028212d4878bc59be4baa7fc391a2f
      # букет гортензий и бледный эскиз здания для верха Чойгаштака
      CHOY_DECO2_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/b00d7867-a432-4891-915f-dcff1fd30d37.gz
      CHOY_DECO2_SHA256: 60d531d472b91c6444fdf28bb2365c068031353e136284ca2714fa949546ff1b
      # реалистичная веточка гортензий и золотая сургучная печать с сердцем
      CHOY_DECO3_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_328NQyffrDU9OqI498OIYuAFPgq/b72e9c8c-314b-4de2-aefe-a551266b69b6.gz
      CHOY_DECO3_SHA256: 2af222dc847bc09d7ceea65842f8c2d2a0929dd29a59ce5161193c54a808ddfc
    steps:
      - uses: actions/checkout@v4

      - name: Fetch invitation assets
        run: |
          curl -fsSL -o assets.tar.gz "$ASSETS_URL"
          echo "$ASSETS_SHA256  assets.tar.gz" | sha256sum -c -
          tar xzf assets.tar.gz -C invite
          curl -fsSL -o assets2.tar.gz "$ASSETS2_URL"
          echo "$ASSETS2_SHA256  assets2.tar.gz" | sha256sum -c -
          tar xzf assets2.tar.gz -C invite2
          rm assets.tar.gz assets2.tar.gz
          curl -fsSL -o davatnoma/img/og-card.jpg "$OG_URL"
          echo "$OG_SHA256  davatnoma/img/og-card.jpg" | sha256sum -c -
          curl -fsSL -o azimxoja-oydin/og-card.jpg "$OG_UZ_URL"
          echo "$OG_UZ_SHA256  azimxoja-oydin/og-card.jpg" | sha256sum -c -
          curl -fsSL -o veronika/og-card.jpg "$OG_RU_URL"
          echo "$OG_RU_SHA256  veronika/og-card.jpg" | sha256sum -c -
          curl -fsSL -o ru/og-card.jpg "$OG_RUG_URL"
          echo "$OG_RUG_SHA256  ru/og-card.jpg" | sha256sum -c -
          mkdir -p choygashtak/img
          curl -fsSL -o choygashtak/img/sprig.webp "$CHOY_SPRIG_URL"
          echo "$CHOY_SPRIG_SHA256  choygashtak/img/sprig.webp" | sha256sum -c -
          curl -fsSL -o choygashtak/img/tea.webp "$CHOY_TEA_URL"
          echo "$CHOY_TEA_SHA256  choygashtak/img/tea.webp" | sha256sum -c -
          curl -fsSL -o choygashtak/og-card.jpg "$OG_CHOY_URL"
          echo "$OG_CHOY_SHA256  choygashtak/og-card.jpg" | sha256sum -c -
          curl -fsSL -o gallery.tar.gz "$CHOY_GALLERY_URL"
          echo "$CHOY_GALLERY_SHA256  gallery.tar.gz" | sha256sum -c -
          tar xzf gallery.tar.gz -C choygashtak/img && rm gallery.tar.gz
          curl -fsSL -o deco2.tar.gz "$CHOY_DECO2_URL"
          echo "$CHOY_DECO2_SHA256  deco2.tar.gz" | sha256sum -c -
          tar xzf deco2.tar.gz -C choygashtak/img && rm deco2.tar.gz
          curl -fsSL -o deco3.tar.gz "$CHOY_DECO3_URL"
          echo "$CHOY_DECO3_SHA256  deco3.tar.gz" | sha256sum -c -
          tar xzf deco3.tar.gz -C choygashtak/img && rm deco3.tar.gz

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html invite invite2 davatnoma azimxoja-oydin veronika ru choygashtak bordo shalfey _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
